name: EARTH-110 Signature Envelope QA
on:
  pull_request:
    paths:
      - 'DOCS/earth-040/earth-110-*'
      - '.github/workflows/earth-110-signature-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node DOCS/earth-040/earth-110-signature-envelope.test.mjs
