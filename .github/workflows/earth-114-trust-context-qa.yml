name: EARTH-114 Trust Context QA
on:
  pull_request:
    paths:
      - 'DOCS/earth-040/earth-114-*'
      - '.github/workflows/earth-114-trust-context-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node DOCS/earth-040/earth-114-trust-context.test.mjs
