name: Ambassador personal login checks

on:
  push:
    branches: ["codex/palaco-ambassade-website"]
    paths:
      - "ambassades/**"
      - "rio/identity-design/**"
      - "tests/browser/ambassades-*.spec.mjs"
      - ".github/workflows/ambassador-auth.yml"
  pull_request:
    branches: ["main", "codex/palaco-ambassade-website", "codex/rio-reception-connectable", "codex/rio-collaboration-identity-draft", "codex/rio-pp-contact-chat-eligibility"]
    paths:
      - "ambassades/**"
      - "rio/identity-design/**"
      - "tests/browser/ambassades-*.spec.mjs"
      - ".github/workflows/ambassador-auth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated authentication dependencies
        working-directory: ambassades/auth
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check browser client syntax
        run: |
          node --check ambassades/portal.js
          node --check ambassades/i18n.js
          node --check ambassades/functions.js
          node --check ambassades/rio/sw.js
          node --check ambassades/auth/device-test.mjs
          node --check ambassades/rio/device-test/app.js
          node --check ambassades/rio/reception/app.js
          node --check ambassades/auth/nova-reception.mjs
          node --check ambassades/auth/nova-check-gate.mjs
          node --check ambassades/auth/auth-security-approval.mjs
          node --check ambassades/auth/auth-safety-provider.mjs
          node --check ambassades/auth/contact-eligibility-design.mjs
      - name: Verify separate persons and shared collaboration in the non-authoritative design model
        run: |
          node --check rio/identity-design/reference.mjs
          node --test rio/identity-design/reference.test.mjs
      - name: Run access isolation and denial tests
        working-directory: ambassades/auth
        run: npm test
      - name: Verify NOVA reception, scoped acceptance and fail-closed control gate
        working-directory: ambassades/auth
        run: node --test nova-reception.test.mjs
      - name: Verify isolated two-device diagnostic relay
        working-directory: ambassades/auth
        run: node --test device-test.test.mjs
      - name: Verify real OIDC and signed safety provider flows over trusted test HTTPS
        working-directory: ambassades/auth
        run: npm run test:oidc
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify access-page flows and responsive layout
        run: npx playwright test tests/browser/ambassades-auth.spec.mjs tests/browser/ambassades-languages.spec.mjs tests/browser/ambassades-functions.spec.mjs tests/browser/ambassades-discussion.spec.mjs
      - name: Verify downloadable RIO software, offline installation and local consent
        run: npx playwright test --config ambassades/rio/playwright.config.mjs
      - name: Verify NOVA reception and control-gate display on mobile and desktop
        run: npx playwright test --config ambassades/rio/nova/playwright.config.mjs
      - name: Verify paired mobile browsers exchange diagnostic challenges
        run: npx playwright test --config ambassades/rio/device-test/playwright.config.mjs
      - name: Verify NOVA front door availability, closed boundaries and accessible phone layout
        run: npx playwright test --config ambassades/rio/reception/playwright.config.mjs

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check private Compose configuration
        run: |
          smoke_dir="$(mktemp -d)"
          printf 'NODE_ENV=production\n' > "$smoke_dir/runtime.env"
          mkdir "$smoke_dir/private"
          PALACO_RUNTIME_ENV_FILE="$smoke_dir/runtime.env" PALACO_PRIVATE_DIR="$smoke_dir/private" docker compose -f ambassades/deployment/compose.yaml config --quiet
          rm -rf -- "$smoke_dir"
      - name: Build isolated authentication image
        run: docker build --pull --build-arg NODE_IMAGE=public.ecr.aws/docker/library/node:24-bookworm-slim -f ambassades/deployment/Dockerfile -t palaco-ambassador-access:ci .
      - name: Verify image startup and closed access
        run: node ambassades/deployment/container-smoke.mjs palaco-ambassador-access:ci
