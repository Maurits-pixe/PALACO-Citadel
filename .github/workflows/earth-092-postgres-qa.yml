name: EARTH-092 PostgreSQL Integration QA
on:
  pull_request:
    paths:
      - 'DOCS/earth-040/earth-089-audit-schema.sql'
      - 'DOCS/earth-040/earth-090-atomic-append.sql'
      - 'DOCS/earth-040/earth-091-postgres-test.sql'
      - '.github/workflows/earth-092-postgres-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: earth_ci
          POSTGRES_PASSWORD: earth_ci_ephemeral
          POSTGRES_DB: earth_audit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U earth_ci -d earth_audit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: earth_ci
      PGPASSWORD: earth_ci_ephemeral
      PGDATABASE: earth_audit_ci
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run isolated rollback checks
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f DOCS/earth-040/earth-089-audit-schema.sql
          psql -X -v ON_ERROR_STOP=1 -f DOCS/earth-040/earth-090-atomic-append.sql
          psql -X -v ON_ERROR_STOP=1 -f DOCS/earth-040/earth-091-postgres-test.sql
      - name: Verify test transaction left no rows
        run: |
          set -euo pipefail
          test "$(psql -X -At -c 'SELECT count(*) FROM earth_audit.review_record')" = "0"
          test "$(psql -X -At -c 'SELECT count(*) FROM earth_audit.checkpoint')" = "0"
