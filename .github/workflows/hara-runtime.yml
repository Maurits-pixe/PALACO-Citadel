name: HARA household runtime
on:
  pull_request:
    paths:
      - 'hara-runtime/**'
      - '.github/workflows/hara-runtime.yml'
      - '.gitignore'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  household-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned runtime dependencies without lifecycle scripts
        run: npm --prefix hara-runtime ci --ignore-scripts --no-audit --no-fund
      - name: Verify SDK loop, household persistence and HTTP authorization boundaries
        run: npm --prefix hara-runtime test
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify real local runtime on phone and desktop with an explicit test provider
        run: npx playwright test --config hara-runtime/playwright.config.mjs
