name: EARTH-116 Trust Attestation QA
on:
  pull_request:
    paths:
      - 'DOCS/earth-040/earth-116-*'
      - '.github/workflows/earth-116-trust-attestation-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node DOCS/earth-040/earth-116-trust-attestation.test.mjs
