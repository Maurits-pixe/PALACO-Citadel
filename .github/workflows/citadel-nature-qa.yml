name: Citadel Samenleving & Natuur browser QA

on:
  pull_request:
    paths:
      - 'modules/samenleving-natuur/**'
      - '.github/workflows/citadel-nature-qa.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'modules/samenleving-natuur/**'
      - '.github/workflows/citadel-nature-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests (desktop and mobile)
        run: npx playwright test --config modules/samenleving-natuur/playwright.config.mjs
      - name: Retain QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citadel-nature-playwright-evidence
          path: |
            modules/samenleving-natuur/test-results/
          if-no-files-found: warn
          retention-days: 14
