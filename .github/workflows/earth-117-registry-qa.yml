name: EARTH-117 Full Registry QA
on:
  pull_request:
    paths:
      - 'DOCS/earth-040/earth-116-*'
      - 'DOCS/earth-040/earth-117-*'
      - '.github/workflows/earth-117-registry-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node DOCS/earth-040/earth-117-canonical-registry.test.mjs
      - run: node DOCS/earth-040/earth-116-trust-attestation.test.mjs
