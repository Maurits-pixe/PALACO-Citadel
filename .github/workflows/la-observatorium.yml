name: Locus Amoenus Observatory checks

on:
  push:
    branches:
      - 'feature/la-observatorium-readonly-20261117'
    paths:
      - 'DOCS/la-observatorium/**'
      - 'index.html'
      - 'app.js'
      - '.github/workflows/la-observatorium.yml'
  pull_request:
    paths:
      - 'DOCS/la-observatorium/**'
      - 'index.html'
      - 'app.js'
      - '.github/workflows/la-observatorium.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observatory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Citadel Observatory static regressions
        run: node --test DOCS/la-observatorium/observatorium.test.mjs
      - name: Run WebCrypto round-trip and tamper regression
        run: node --test DOCS/la-observatorium/dossier-roundtrip.test.mjs
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright test dependency
        run: npm install --prefix DOCS/la-observatorium --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Install headless Chromium
        run: ./DOCS/la-observatorium/node_modules/.bin/playwright install --with-deps chromium
      - name: Assert local Playwright browser revision is available
        working-directory: DOCS/la-observatorium
        run: node --input-type=module -e "import { chromium } from 'playwright'; import { existsSync } from 'node:fs'; import { createRequire } from 'node:module'; const require = createRequire(import.meta.url); const version = require('playwright/package.json').version; if (version !== '1.56.1') throw new Error('Wrong Playwright version: ' + version); const binary = chromium.executablePath(); if (!existsSync(binary)) throw new Error('Playwright Chromium binary missing: ' + binary); console.log('Playwright ' + version + ', browser: ' + binary)"
      - name: Run mobile and desktop browser journey
        run: node --test DOCS/la-observatorium/browser-acceptance.test.mjs
