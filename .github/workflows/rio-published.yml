name: Published PALACO RIO checks

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/verify-rio-published.mjs"
      - ".github/workflows/rio-published.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-download:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify actual HTTPS RIO app, software download and closed private routes
        run: node scripts/verify-rio-published.mjs
