name: RIO unified static preview
on:
  pull_request:
    paths:
      - 'ambassades/rio/**'
      - 'rio/backend/public/**'
      - 'rio/backend/client.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'ambassades/deployment/render-unified-preview.yaml'
      - 'scripts/build-rio-unified-preview*'
      - 'scripts/serve-rio-unified-preview*'
      - 'tests/rio-unified-preview/**'
      - '.github/workflows/rio-unified-preview.yml'
      - '.gitattributes'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unified-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --include=dev --ignore-scripts
      - name: Verify explicit public build and closed static deployment profile
        run: node --test --test-concurrency=1 scripts/build-rio-unified-preview.test.mjs scripts/serve-rio-unified-preview.test.mjs tests/rio-unified-preview/static-fixture.test.mjs tests/rio-unified-preview/engine-session.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Verify integrated navigation, offline cache isolation and waiting update
        run: npx playwright test --config tests/rio-unified-preview/playwright.config.mjs
