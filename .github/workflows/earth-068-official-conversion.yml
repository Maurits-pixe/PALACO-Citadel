name: EARTH-068 Official Source Conversion Evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned converter dependency
        run: python -m pip install --disable-pip-version-check 'pyshp==2.3.1'
      - name: Acquire and validate official archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 90 --proto '=https' --tlsv1.2 --output ne_110m_land.zip 'https://naturalearth.s3.amazonaws.com/110m_physical/ne_110m_land.zip'
          test -s ne_110m_land.zip
          test "$(stat -c %s ne_110m_land.zip)" -le 20971520
          sha256sum ne_110m_land.zip > source-SHA256SUMS.txt
      - name: Convert with reproducible evidence (NOT ADMITTED)
        run: python DOCS/earth-040/earth-066-convert.py ne_110m_land.zip earth-068-output
      - name: Verify deterministic conversion
        shell: bash
        run: |
          set -euo pipefail
          python DOCS/earth-040/earth-066-convert.py ne_110m_land.zip earth-068-repeat
          cmp earth-068-output/ne_110m_land.geojson earth-068-repeat/ne_110m_land.geojson
          sha256sum earth-068-output/ne_110m_land.geojson
      - name: Upload unreviewed source and conversion evidence
        uses: actions/upload-artifact@v4
        with:
          name: earth-068-unreviewed-conversion
          path: |
            ne_110m_land.zip
            source-SHA256SUMS.txt
            earth-068-output/ne_110m_land.geojson
            earth-068-output/conversion-evidence.json
          retention-days: 14
