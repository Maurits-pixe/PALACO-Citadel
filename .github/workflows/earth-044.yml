name: EARTH-044 Geo Engine Validation
on:
  pull_request:
    paths:
      - 'DOCS/earth-040/**'
      - '.github/workflows/earth-044.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geo-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Geo engine unit tests
        run: node --test DOCS/earth-040/geo-engine.test.mjs
      - name: Check JSON syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('DOCS/earth-040/geo-demo.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('DOCS/earth-040/registry.json','utf8'))"
      - name: Validate JavaScript syntax
        run: node --check DOCS/earth-040/geo-engine.mjs
