name: EARTH-106 JSON Hardening QA
on:
  pull_request:
    paths:
      - 'DOCS/earth-040/earth-104-legacy.py'
      - 'DOCS/earth-040/earth-106-hardening-test.py'
      - '.github/workflows/earth-106-hardening-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 DOCS/earth-040/earth-106-hardening-test.py
      - run: python3 DOCS/earth-040/earth-105-crosslang-test.py
