name: CI

"on":
  push:
    branches: [ "main", "feature/earth-040-world-registry" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  earth-source-admission:
    name: EARTH-120 source admission (synthetic negative tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source pin gate (does not admit official dataset)
        run: python DOCS/earth-040/earth-120-source-admission.test.py -v
      - name: Verify pending official manifest remains HOLD
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("DOCS/earth-040/earth-120-source-manifest.json")
          record=json.loads(p.read_text(encoding="utf-8"))
          assert record["status"]=="PENDING_INDEPENDENT_REVIEW"
          assert record["sha256"] is None
          print("EARTH-120 official source remains HOLD")
          PY
