name: PALACO CI

"on":
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bastion-backend/package-lock.json
      - name: Install repository dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run repository test suite
        run: npm test
      - name: Install Bastion demo API dependencies
        run: npm ci --prefix bastion-backend
      - name: Test Bastion demo API
        run: npm --prefix bastion-backend test
