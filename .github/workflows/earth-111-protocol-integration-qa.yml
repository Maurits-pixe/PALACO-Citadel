name: EARTH-111 Protocol Integration QA
on:
  pull_request:
    paths:
      - 'DOCS/earth-040/earth-108-signed-evidence.mjs'
      - 'DOCS/earth-040/earth-110-signature-envelope.mjs'
      - 'DOCS/earth-040/earth-111-protocol-integration.test.mjs'
      - '.github/workflows/earth-111-protocol-integration-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node DOCS/earth-040/earth-108-signed-evidence.test.mjs
      - run: node DOCS/earth-040/earth-110-signature-envelope.test.mjs
      - run: node DOCS/earth-040/earth-111-protocol-integration.test.mjs
