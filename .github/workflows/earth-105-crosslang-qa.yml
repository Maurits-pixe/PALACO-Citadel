name: EARTH-105 Cross-language Audit QA
on:
  pull_request:
    paths:
      - 'DOCS/earth-040/earth-104-legacy.py'
      - 'DOCS/earth-040/earth-105-*'
      - '.github/workflows/earth-105-crosslang-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 DOCS/earth-040/earth-105-crosslang-test.py
