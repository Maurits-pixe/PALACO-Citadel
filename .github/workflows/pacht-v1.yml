name: PACHT-V1 execution evidence
on:
  pull_request:
    paths:
      - 'atlantis/**'
      - '.github/workflows/pacht-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pacht-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bind runtime
        run: |
          node --version
          echo "GITHUB_SHA=$GITHUB_SHA"
      - name: Execute PACHT-V1 semantic harness
        run: node atlantis/tests/pacht-v1-harness.cjs
