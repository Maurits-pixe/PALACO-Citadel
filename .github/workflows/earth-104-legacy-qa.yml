name: EARTH-104 Legacy Audit QA
on:
  pull_request:
    paths:
      - 'DOCS/earth-040/earth-104-*.py'
      - '.github/workflows/earth-104-legacy-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 DOCS/earth-040/earth-104-test.py
